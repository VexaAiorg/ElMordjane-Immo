version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: elmordjane_db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=your_username
      - POSTGRES_PASSWORD=your_password
      - POSTGRES_DB=container_name
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauzxa -d ElMordjanDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elmordjane_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://name:pass@db:5432/exemple
      - JWT_SECRET=your_jwt_secret
      - ADMIN_EMAIL=yourEmail
      - ADMIN_PASSWORD=Pass
      # Optional: Add these if you handle uploads locally
      # - UPLOAD_DIR=uploads
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elmordjane_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
